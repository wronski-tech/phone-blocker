name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      # Same major version as compose.yaml. The SQLite job doesn't use it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Empty means SQLite (see tests/conftest.py).
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2; the project publishes no major tags
        with:
          working-directory: backend
          python-version: "3.12"  # the Docker image's version
          cache-suffix: ${{ matrix.database }}
      - run: uv sync --locked
      - run: uv run pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t phone-blocker .
      # The image must start, migrate an empty database and serve /health.
      - run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/ci.db phone-blocker
          for _ in $(seq 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
