# Production stack: PostgreSQL + API + Caddy (automatic HTTPS via Let's Encrypt).
# Copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phone_blocker
      POSTGRES_USER: phone_blocker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "phone_blocker", "-d", "phone_blocker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://phone_blocker:${POSTGRES_PASSWORD}@db:5432/phone_blocker
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      BLOCK_THRESHOLD: ${BLOCK_THRESHOLD:-1}
    depends_on:
      db:
        condition: service_healthy

  # Refreshes the public directory from every source, then again 24 h after each round.
  importer:
    build: .
    restart: unless-stopped
    command: phone-blocker import all --every-hours 24
    environment:
      DATABASE_URL: postgresql+psycopg://phone_blocker:${POSTGRES_PASSWORD}@db:5432/phone_blocker
      BLOCK_THRESHOLD: ${BLOCK_THRESHOLD:-1}
    healthcheck:
      disable: true  # the image's check probes the API port
    depends_on:
      api:
        condition: service_healthy  # the api container runs the migrations

  # Daily compressed pg_dump into ./backups on the host, keeping the newest 14.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/phone_blocker-$$(date -u +%Y%m%d-%H%M).dump
          if pg_dump -h db -U phone_blocker -d phone_blocker -Fc -f "$$file.partial"; then
            mv "$$file.partial" "$$file" && echo "backup: wrote $$file"
            ls -1t /backups/*.dump | tail -n +15 | xargs -r rm --
          else
            rm -f "$$file.partial"; echo "backup: pg_dump failed"
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to api:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
