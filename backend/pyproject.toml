[project]
name = "phone-blocker"
version = "0.1.0"
description = "Backend for a personal unwanted-call blocker: public phone directory + spam reports, synced to an iPhone Call Directory extension."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
phone-blocker = "phone_blocker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
